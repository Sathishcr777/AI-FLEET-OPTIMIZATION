# =================================================================
# FleetIQ Eclipse Mosquitto Configuration
# =================================================================

# Plain MQTT Listener
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket Listener for direct browser telemetry streaming (if needed)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
connection_messages true
